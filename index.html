<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Compras</title>
    <link rel="stylesheet" href="style.css">
    <script src="./script.js" defer></script>
</head>
<body>
    <main>
        <div id="aviso">
            <p>
                AVISO!! FRETE GRÁTIS ACIMA DE R$ 100
            </p>
        </div>
    <h1> Sistema Compras</h1>
    <div>
        <h2 id="textoTotal">Valor total</h2>
    <div class="barraTotal">
        <div class="BarraMenor" id="BarraGeral">
        </div>
       
    </div></div>
    <div>
        <h2>⌨️ Teclado R$ 40</h2>
        <div style="display: flex; align-items: center; justify-content: center; gap: 10px;">
        <button id="MaisTeclado" class="botaoMais">+</button>
        <p id="textoTeclado"></p>
            <button id="MenosTeclado" class="botaoMenos">-</button>
    </div></div>
    <div>
        <h2>🖱️ Mouse R$ 25</h2>
               <div style="display: flex; align-items: center; justify-content: center; gap: 10px;">
           <button id="MaisMouse" class="botaoMais">+</button>
        <p id="textoMouse"></p>
            <button id="MenosMouse" class="botaoMenos">-</button>
               </div></div>
    <div>
        <h2>🎧 Headset R$ 50</h2>
                <div style="display: flex; align-items: center; justify-content: center; gap: 10px;">
            <button id="MaisHeadset" class="botaoMais">+</button>
        <p id="textoHeadset"></p>
            <button id="MenosHeadset" class="botaoMenos">-</button>
                </div> </div>
<div>
    <button id="botaoFinal">FINALIZAR</button>
</div>
    </main>
</body>
</html>
